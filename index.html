<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My EF Goals</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="My EF Goals">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f8; --card:#ffffff; --soft:#f0eef2; --ink:#000000; --muted:#77727d; --line:#e6e3e9;
  --pink:#ff1f7a; --pink-ink:#e0006a; --pink-soft:#ffe6f0; --on-pink:#ffffff;
  --side:#000000; --on-side:#ffffff; --slot:#ebe8ee; --good:#0a8a4a; --warn:#c2410c;
  --shadow:0 1px 2px rgba(20,0,10,.04),0 8px 24px rgba(20,0,10,.06); --hero:#000000; --barbg:#000000;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#131215; --soft:#1d1b20; --ink:#ffffff; --muted:#9e98a6; --line:#2a2730;
    --pink:#ff3d8d; --pink-ink:#ff6aa8; --pink-soft:#33091d; --on-pink:#000000;
    --side:#0d0c0f; --on-side:#ffffff; --slot:#26232b; --good:#3ddc8c; --warn:#ffb46b;
    --shadow:none; --hero:#1c1119; --barbg:#1d1b20; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#131215; --soft:#1d1b20; --ink:#ffffff; --muted:#9e98a6; --line:#2a2730;
  --pink:#ff3d8d; --pink-ink:#ff6aa8; --pink-soft:#33091d; --on-pink:#000000;
  --side:#0d0c0f; --on-side:#ffffff; --slot:#26232b; --good:#3ddc8c; --warn:#ffb46b;
  --shadow:none; --hero:#1c1119; --barbg:#1d1b20; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:var(--on-side);display:flex;flex-direction:column;padding:28px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:30;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px 30px}
.logo img{width:42px;height:42px;border-radius:12px}
.logo b{font-weight:700;font-size:17px;line-height:1.15;letter-spacing:-.01em}
.logo b span{display:block;font-weight:400;font-size:12px;color:#a8a2b0;letter-spacing:0}
.snav{display:grid;gap:4px}
.snav a{display:flex;align-items:center;gap:12px;color:#c9c4cf;text-decoration:none;padding:11px 14px;border-radius:14px;font-weight:500}
.snav a svg{width:20px;height:20px;flex:none}
.snav a:hover{background:#1c1a20;color:#fff}
.snav a[aria-current="page"]{background:var(--pink);color:#000;font-weight:600}
.snav a.cta{margin-top:14px;border:1.5px dashed #3a3640}
.snav a.cta[aria-current="page"]{border-color:transparent}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 10px 0;border-top:1px solid #2a2730;font-size:12px;color:#a8a2b0;overflow:hidden}
.sfoot span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#000;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

.mtop{display:none}
.bbar{display:none}
main{margin-left:248px;padding:36px 44px 72px;max-width:1120px}

@media (max-width:900px){
  .side{display:none}
  main{margin-left:0;padding:20px 18px calc(112px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 18px}
  .mtop img{width:34px;height:34px;border-radius:10px}
  .mtop b{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .mtop .avatar{margin-left:auto;width:32px;height:32px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
  .bbar{display:grid;grid-template-columns:1fr 96px 1fr;align-items:end;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:68px;background:var(--barbg);border-radius:24px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .bbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:68px;color:#8d8794;text-decoration:none;font-size:11px;font-weight:500}
  .bbar a svg{width:22px;height:22px}
  .bbar a[aria-current="page"]{color:#fff}
  .bbar a[aria-current="page"] svg{color:var(--pink)}
  .bbar a.plus{height:auto;align-self:start;margin-top:-22px}
  .bbar a.plus span.btn-c{width:64px;height:64px;border-radius:50%;background:var(--pink);display:grid;place-items:center;color:#000;border:5px solid var(--bg);box-shadow:0 6px 18px rgba(255,31,122,.45)}
  .bbar a.plus svg{width:28px;height:28px}
  .bbar a.plus[aria-current="page"] span.btn-c{background:#fff}
}

/* ---------- type & layout ---------- */
.proto{display:inline-flex;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;margin:0 0 22px}
.proto b{color:var(--pink-ink);font-weight:600}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.03em;margin:0 0 4px;font-weight:700}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 14px;font-weight:600}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
section{margin-top:18px}

/* ---------- dashboard ---------- */
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.weekbar h1{margin-right:auto}
.wnav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.iconbtn:hover{background:var(--soft)}
.iconbtn:disabled{opacity:.3;cursor:default;background:transparent}
.wlabel{font-size:13px;font-weight:600;padding:0 6px;white-space:nowrap}
.now{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--pink);color:var(--on-pink);border:0}
.now.off{background:var(--soft);color:var(--ink)}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--hero);color:#fff;border:0}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .num b{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1}
.ring .num span{font-size:12px;color:#a8a2b0}
.hero h2{color:#fff;font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
.hero p{margin:0;color:#c9c4cf;max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:#a8a2b0}
@media (max-width:620px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{grid-template-columns:repeat(3,1fr);text-align:left}
  .stat b{font-size:17px}
}

.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}

.grp{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 2px;text-transform:none}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tname{font-weight:600}
.tname small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.tcount{font-weight:700;font-size:15px}
.tcount.hit{color:var(--pink-ink)}
.slots{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:5px}
.slot{width:24px;height:30px;border-radius:7px;background:var(--slot);position:relative;overflow:hidden}
.slot::before,.slot::after{content:"";position:absolute;left:50%;width:8px;height:8px;border-radius:50%;background:var(--card);transform:translateX(-50%)}
.slot::before{top:-4px}.slot::after{bottom:-4px}
.slot.done{background:var(--pink)}
.slot.extra{background:var(--ink)}
.nogoal{font-size:13px;color:var(--muted)}

.coach{background:var(--pink);color:#000;border:0}
.coach h2{color:#000;margin-bottom:6px}
.coach p{margin:0 0 12px;font-size:14px}
.coach .plan{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#000;color:#fff;font-weight:600;padding:7px 14px;border-radius:999px;font-size:13px}
.pill.dim{background:rgba(255,255,255,.55);color:#000}
.coach .foot{font-size:12px;opacity:.85;margin:14px 0 0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:12px}
td.warn{color:var(--warn);font-weight:600}
td.ok{color:var(--good);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}

.chartwrap{overflow-x:auto;padding-bottom:6px}
.chart{display:flex;align-items:flex-end;gap:5px;min-width:max-content}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.col{width:16px;height:120px;position:relative}
.col .g{position:absolute;bottom:0;left:0;right:0;background:var(--slot);border-radius:8px}
.col .r{position:absolute;bottom:0;left:0;right:0;border-radius:8px;background:var(--pink)}
.col .r.part{background:color-mix(in srgb,var(--pink) 45%,var(--slot))}
.wk .lb{font-size:10px;color:var(--muted)}
.wk.sel .col{outline:2px solid var(--ink);outline-offset:2px;border-radius:9px}
.wk.sel .lb{color:var(--ink);font-weight:700}
.wk.cur .lb{color:var(--pink-ink);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:0;margin-right:6px}

/* ---------- input ---------- */
.datecard{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.datecard label{font-weight:600}
input[type=date],textarea,input[type=search]{background:var(--soft);border:1px solid transparent;border-radius:14px;padding:11px 14px;width:100%}
input[type=date]{width:auto}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{border-color:var(--pink);outline:none;background:var(--card)}
.hint{font-size:12px;color:var(--muted);margin:0}
.items{display:grid;gap:14px;margin-top:14px}
.item{position:relative}
.itemhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.itemhead b{font-weight:600}
.itemhead b span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#000;color:#fff;font-size:12px;margin-right:8px;vertical-align:1px}
.rm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.pgroups{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
.pgroups .gl{font-size:12px;color:var(--muted);font-weight:500;width:52px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:#000;color:#fff;border-color:#000}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:#fff;color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}}
.chip.pk[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#000}
.prog{font-size:12px;color:var(--muted);margin:10px 0 0;min-height:18px}
.prog b{color:var(--pink-ink);font-weight:600}
.notefield{margin-top:14px}
.notefield label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.addbtn{width:100%;margin-top:14px;padding:16px;border-radius:20px;border:1.5px dashed var(--line);background:transparent;font-weight:600;color:var(--muted)}
.addbtn:hover{border-color:var(--pink);color:var(--pink-ink)}
.savebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.btn{background:var(--pink);color:#000;border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:15px}
.btn:disabled{opacity:.35;cursor:default}
.summary{color:var(--muted);font-size:13px}

/* ---------- log ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.filters input{max-width:240px}
.lweek{margin-top:14px;padding:6px 20px 8px}
.lweek h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;font-weight:600;margin:12px 0 4px}
.lweek h3 span{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.entry{display:grid;grid-template-columns:110px 150px 1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.ehead{font-size:12px;color:var(--muted);border:0;padding:4px 20px;margin-top:10px}
.when{color:var(--muted);font-size:13px;line-height:1.35}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px}
.tag.on{background:var(--pink);color:#000}
.tag.off{background:#000;color:#fff}
:root[data-theme="dark"] .tag.off{background:#fff;color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.off{background:#fff;color:#000}}
.new{font-size:10px;font-weight:700;color:var(--pink-ink);margin-left:6px}
.shown{background:var(--soft);border:0;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.shown[aria-expanded="true"]{background:var(--pink-soft);color:var(--pink-ink)}
.nonote{font-size:12px;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.entry .n{grid-column:1 / -1;background:var(--pink-soft);border-radius:14px;padding:10px 14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.emptystate{padding:40px 0;color:var(--muted)}
@media (max-width:620px){
  .entry{grid-template-columns:1fr auto;gap:6px 10px}
  .entry .tg{grid-row:1;grid-column:1}
  .entry .del{grid-row:1;grid-column:2;justify-self:end}
  .entry .when{grid-row:2;grid-column:1}
  .entry .ncol{grid-row:2;grid-column:2;justify-self:end}
  .ehead{display:none}
  .lweek{padding:4px 16px 8px}
}

/* ---------- gate & toast ---------- */
.gate{min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;padding:24px}
.gate .in{max-width:400px;width:100%;text-align:center}
.gate img{width:96px;height:96px;border-radius:26px;box-shadow:0 16px 40px rgba(255,31,122,.3)}
.gate h1{color:#fff;font-size:34px;margin:22px 0 8px}
.gate p{color:#a8a2b0;font-size:14px}
.gbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:28px;background:#fff;color:#000;border:0;border-radius:18px;padding:14px 18px;font-weight:600;text-align:left}
.gbtn small{display:block;font-weight:400;color:#666;font-size:12px}
.gdot{width:26px;height:26px;border-radius:50%;flex:none;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:#000;color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;font-size:14px;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:901px){.toast{bottom:32px;left:calc(50% + 124px)}}

.gwrap{display:flex;justify-content:center;margin-top:28px;min-height:44px}
.gmsg{min-height:20px;color:#ff8fbe!important;font-size:13px;margin-top:14px}
.sfoot .em{display:flex;flex-direction:column;min-width:0}
.sfoot .em span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so{background:none;border:0;padding:0;color:#ff8fbe;font-size:12px;text-align:left;text-decoration:underline;text-underline-offset:3px}
button.avatar{border:0;padding:0}
.busy{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:60;overflow:hidden}
.busy::after{content:"";position:absolute;inset:0 auto 0 -40%;width:40%;background:var(--pink);animation:slide 1s ease-in-out infinite}
@keyframes slide{to{left:100%}}
.btn[aria-busy="true"]{opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="in">
    <img src="icons/icon-192.png" alt="My EF Goals logo">
    <h1>My EF Goals</h1>
    <p>Use every EF credit before 16 Jul 2027.</p>
    <div id="gbtn" class="gwrap"></div>
    <p id="gateMsg" class="gmsg" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="logo"><img src="icons/icon-192.png" alt=""><b>My EF Goals<span>Week <span id="sideWk"></span></span></b></div>
    <nav class="snav" aria-label="Main">
      <a href="#dashboard" data-v="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</a>
      <a href="#log" data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Log</a>
      <a href="#input" data-v="input" class="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add class</a>
    </nav>
    <div class="sfoot"><span class="avatar" data-ini>T</span><span class="em"><span data-email></span><button class="so" data-signout>Sign out</button></span></div>
  </aside>

  <div class="mtop"><img src="icons/icon-192.png" alt=""><b>My EF Goals</b><button class="avatar" data-ini data-signout-ask aria-label="Account">T</button></div>

  <main>

    <!-- DASHBOARD -->
    <div id="v-dashboard" hidden>
      <div class="weekbar">
        <h1 id="hi">Hi</h1>
        <div class="wnav">
          <button class="iconbtn" id="prevW" aria-label="Previous week"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="wlabel" id="wkTitle"></span>
          <button class="iconbtn" id="nextW" aria-label="Next week"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>

        <button class="now" id="toNow">This week</button>

      <div class="card hero">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#26232b" stroke-width="12"/><circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="#ff1f7a" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 327"/></svg>
          <div class="num"><b id="ringPct">0%</b><span id="ringOf"></span></div>

          <div class="card"><h2>Credits left</h2><div class="tablewrap"><table id="credTable"></table></div><p class="note" id="credNote"></p></div>

        <h2>Every week</h2>
        <div class="chartwrap" id="chartwrap"><div class="chart" id="chart"></div></div>
        <div class="legend"><span><i style="background:var(--pink)"></i>Goal hit</span><span><i style="background:color-mix(in srgb,var(--pink) 45%,var(--slot))"></i>Partly done</span><span><i style="background:var(--slot)"></i>Goal</span><span>Tap a week to open it</span></div>

    <!-- INPUT -->
    <div id="v-input" hidden>
      <h1>Add class</h1>

      <div class="items" id="items"></div>
      <button class="addbtn" id="addItem">+ Add another class</button>
      <div class="savebar">
        <button class="btn" id="saveBtn" disabled>Save</button>
        <span class="summary" id="saveSum"></span>

    </div>

    <!-- LOG -->
    <div id="v-log" hidden>
      <h1>Log</h1>
      <p class="sub" id="logSub"></p>
      <div class="filters">
        <div class="chips" id="logFilter"></div>
        <input type="search" id="logSearch" placeholder="Search notes">
        <button class="chip" id="allNotes" aria-pressed="false">Show all notes</button>
      </div>

      <div id="logList"></div>
    </div>
  </main>

  <nav class="bbar" aria-label="Main">
    <a href="#dashboard" data-v="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</a>
    <a href="#input" data-v="input" class="plus" aria-label="Add class"><span class="btn-c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#log" data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Log</a>
  </nav>
</div>
<div class="busy" id="busy" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
const C = window.EF_CONFIG || {};
const CATS = [
  {k:"Private Class", g:"Online"},
  {k:"Online Class", g:"Online"},
  {k:"Lessons", g:"Online"},
  {k:"F2F", g:"Offline"},
  {k:"Group Class", g:"Offline"}
];
const CK = CATS.map(c=>c.k);

// ---------- dates & weeks (Monday-start, same as WEEKNUM(date,2)) ----------
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt = d => d.getDate()+" "+MON[d.getMonth()];
const fmtY = d => d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();
const monIdx = d => (d.getDay()+6)%7;
function weekNo(d){ const j=new Date(d.getFullYear(),0,1); const doy=Math.round((d-j)/864e5); return Math.floor((doy+monIdx(j))/7)+1; }
const weekKey = d => weekNo(d)+" - "+d.getFullYear();
function weekRange(key){
  const [n,y]=key.split(" - ").map(Number); const j=new Date(y,0,1);
  let s=addDays(j,(n-1)*7-monIdx(j)), e=addDays(s,6);
  if(s<j) s=j; const dec=new Date(y,11,31); if(e>dec) e=dec; return {s,e};
}
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const curKey = weekKey(today);

// ---------- state (filled from the sheet) ----------
let START, END, BASE, PLAN={}, WEEKS=[], curIdx=-1, ENTRIES=[];
const CACHE="myefgoals.cache.v1", TK="myefgoals.token.v1";
function applyData(data){
  START=data.config.start; END=data.config.end;
  BASE={from:data.config.baseFrom, credits:data.config.credits};
  PLAN={}; data.plan.forEach(r=>{PLAN[r[0]]={}; CK.forEach((k,i)=>PLAN[r[0]][k]=Number(r[i+1])||0);});
  ENTRIES=data.entries.filter(e=>CK.includes(e.c));
  WEEKS=[]; for(let d=pd(START); d<=pd(END); d=addDays(d,1)){ const k=weekKey(d); if(WEEKS[WEEKS.length-1]!==k) WEEKS.push(k); }
  curIdx=WEEKS.indexOf(curKey);
  if(selIdx===null) selIdx=curIdx>-1?curIdx:(today<pd(START)?0:WEEKS.length-1);
  inDate.min=START; inDate.max=END;
}
const entries=()=>ENTRIES;
function reality(key){ const r={}; CK.forEach(k=>r[k]=0); ENTRIES.forEach(e=>{ if(weekKey(pd(e.d))===key) r[e.c]++; }); return r; }
function goals(key){
  if(PLAN[key]) return PLAN[key];
  const i=WEEKS.indexOf(key);
  if(i>-1 && (curIdx<0 ? today>pd(END) : i<curIdx)) return reality(key);
  const z={}; CK.forEach(k=>z[k]=0); return z;
}
function creditsLeft(){ const c=Object.assign({},BASE.credits); ENTRIES.forEach(e=>{ if(e.d>=BASE.from) c[e.c]--; }); return c; }
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
const plural=(n,w,p)=>n+" "+(n===1?w:(p||w+"s"));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

// ---------- API ----------
let idToken=null, busyN=0;
function busy(on){ busyN+=on?1:-1; $("busy").hidden=busyN<=0; }
async function api(action,payload){
  busy(true);
  try{
    const res=await fetch(C.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({action,idToken},payload||{}))});
    const j=await res.json();
    if(!j.ok){ if(/^AUTH/.test(j.error||"")) signOut("Your session ended. Sign in again."); throw new Error(j.error||"Request failed"); }
    return j;
  } finally { busy(false); }
}
async function refresh(){
  try{
    const data=await api("bootstrap");
    try{ localStorage.setItem(CACHE,JSON.stringify(data)); }catch(e){}
    applyData(data); render();
  }catch(err){ if(!/^AUTH/.test(err.message)) toast("Couldn’t load from the sheet. Showing your last saved copy."); }
}

// ---------- auth (Google Identity Services) ----------
function decodeJwt(t){ try{ const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(atob(b).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""))); }catch(e){ return {}; } }
function savedToken(){ try{ const s=JSON.parse(localStorage.getItem(TK)||"null"); if(s && s.exp*1000>Date.now()+60000) return s.t; }catch(e){} return null; }
function onCredential(r){
  const p=decodeJwt(r.credential);
  if(String(p.email||"").toLowerCase()!==String(C.ALLOWED_EMAIL).toLowerCase()){
    $("gateMsg").textContent="This app is private. Sign in with "+C.ALLOWED_EMAIL+".";
    google.accounts.id.disableAutoSelect(); return;
  }
  idToken=r.credential;
  try{ localStorage.setItem(TK,JSON.stringify({t:idToken,exp:p.exp,name:p.given_name||p.name||"",email:p.email})); }catch(e){}
  enter(p);
}
window.onGisLoad=function(){
  if(!C.CLIENT_ID||/PASTE/.test(C.CLIENT_ID)){ $("gateMsg").textContent="Add your Client ID and API URL in config.js."; return; }
  google.accounts.id.initialize({client_id:C.CLIENT_ID, callback:onCredential, auto_select:true, itp_support:true, use_fedcm_for_prompt:true});
  google.accounts.id.renderButton($("gbtn"),{theme:"outline",size:"large",shape:"pill",text:"continue_with",width:300});
  const t=savedToken();
  if(t){ idToken=t; let p={}; try{p=JSON.parse(localStorage.getItem(TK));}catch(e){} enter(p); }
  else google.accounts.id.prompt();
};
function signOut(msg){
  idToken=null; try{ localStorage.removeItem(TK); }catch(e){}
  if(window.google&&google.accounts) google.accounts.id.disableAutoSelect();
  $("app").hidden=true; $("gate").hidden=false; $("gateMsg").textContent=msg||"";
  if(msg && window.google&&google.accounts) google.accounts.id.prompt();
}
document.querySelectorAll("[data-signout]").forEach(b=>b.onclick=()=>signOut("Signed out."));
document.querySelectorAll("[data-signout-ask]").forEach(b=>b.onclick=()=>{ if(confirm("Signed in as "+C.ALLOWED_EMAIL+".\nSign out?")) signOut("Signed out."); });

let entered=false;
function enter(p){
  $("gate").hidden=true; $("app").hidden=false;
  const name=(p&&(p.given_name||p.name))||"";
  $("hi").textContent=name?"Hi "+name:"Hi";
  document.querySelectorAll("[data-ini]").forEach(a=>a.textContent=(name||"T").charAt(0).toUpperCase());
  document.querySelectorAll("[data-email]").forEach(a=>a.textContent=(p&&p.email)||C.ALLOWED_EMAIL);
  $("sideWk").textContent=curKey;
  if(!entered){
    entered=true;
    try{ const c=JSON.parse(localStorage.getItem(CACHE)||"null"); if(c){ applyData(c); } }catch(e){}
    renderItems(); buildLogFilter();
  }
  route(); refresh();
}

// ---------- routing ----------
let view="dashboard";
function route(){
  const h=(location.hash||"").replace("#","");
  view=["input","dashboard","log"].includes(h)?h:"dashboard";
  ["input","dashboard","log"].forEach(v=>$("v-"+v).hidden=v!==view);
  document.querySelectorAll("[data-v]").forEach(a=>a.setAttribute("aria-current",a.dataset.v===view?"page":"false"));
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
const ready=()=>WEEKS.length>0;

// ---------- dashboard ----------
let selIdx=null;
function renderDashboard(){
  if(!ready()) return;
  const key=WEEKS[selIdx], {s,e}=weekRange(key);
  const g=goals(key), r=reality(key);
  const isCur=key===curKey, isPast = curIdx<0 ? today>pd(END) : selIdx<curIdx;
  $("wkTitle").textContent="Week "+key.split(" - ")[0]+", "+fmt(s)+"–"+fmt(e);
  const tn=$("toNow"); tn.textContent=isCur?"This week":"Back to this week"; tn.classList.toggle("off",!isCur); tn.disabled=isCur||curIdx<0;
  $("prevW").disabled=selIdx===0; $("nextW").disabled=selIdx===WEEKS.length-1;

  const gT=sum(g), rT=CK.reduce((a,k)=>a+Math.min(r[k],g[k]),0), rAll=sum(r);
  const pct=gT?Math.round(rT/gT*100):0;
  const daysLeft = isCur? Math.round((e-today)/864e5)+1 : (isPast?0:Math.round((e-s)/864e5)+1);
  const arc=$("ringArc"); arc.setAttribute("stroke-dasharray",(327*pct/100)+" 327"); arc.style.opacity=pct?1:0;
  $("ringPct").textContent=gT?pct+"%":"–";
  $("ringOf").textContent=rAll+" of "+gT+" done";
  let title, sub;
  if(gT===0){title="No goals this week";sub="Nothing planned for these days.";}
  else if(rT>=gT){title="Week goal hit";sub="Every extra class now lightens the weeks ahead.";}
  else if(isCur){title=(gT-rT)+" classes to go";sub=plural(daysLeft,"day")+" left this week, including today. Today’s plan shows what to book.";}
  else if(isPast){title="Closed "+(gT-rT)+" short";sub="Those credits rolled into later weeks.";}
  else {title=gT+" classes planned";sub="Starts "+DOW[s.getDay()]+" "+fmt(s)+".";}
  $("heroTitle").textContent=title; $("heroSub").textContent=sub;
  const cl=creditsLeft(), totalLeft=sum(cl);
  const daysToEnd=Math.max(0,Math.round((pd(END)-today)/864e5));
  $("stats").innerHTML=
    '<div class="stat"><b>'+totalLeft+'</b><span>credits left</span></div>'+
    '<div class="stat"><b>'+daysToEnd+'</b><span>days to '+fmt(pd(END))+'</span></div>'+
    '<div class="stat"><b>'+(daysToEnd?(totalLeft/daysToEnd).toFixed(1):"–")+'</b><span>classes / day</span></div>';

  let html="";
  ["Online","Offline"].forEach(grp=>{
    html+='<div class="grp">'+grp+'</div>';
    CATS.filter(c=>c.g===grp).forEach(c=>{
      const k=c.k, gk=g[k], rk=r[k];
      let slots=""; for(let i=0;i<Math.max(gk,rk);i++) slots+='<span class="slot '+(i<rk?(i<gk?"done":"extra"):"")+'"></span>';
      if(!slots) slots='<span class="nogoal">No goal</span>';
      html+='<div class="trow"><div class="tname">'+k+'<small>'+cl[k]+' left</small></div><div class="tcount'+(gk>0&&rk>=gk?" hit":"")+'">'+rk+' / '+gk+'</div><div class="slots" aria-label="'+rk+' of '+gk+'">'+slots+'</div></div>';
    });
  });
  $("tickets").innerHTML=html;

  const coach=$("coach"), weeksLeft=Math.max(0,WEEKS.length-1-curIdx);
  if(isCur){
    const need=CK.map(k=>({k,n:Math.max(0,g[k]-r[k])})).filter(x=>x.n>0);
    if(!need.length) coach.innerHTML='<h2>You’re ahead</h2><p>This week is done. An extra Online Class or Lesson now takes pressure off the weeks ahead.</p>';
    else{
      const roll=need.reduce((a,x)=>a+x.n,0);
      coach.innerHTML='<h2>Today’s plan</h2><p>Spread what’s left over the '+plural(daysLeft,"day")+' remaining.</p><div class="plan">'+
        need.map(x=>'<span class="pill">'+Math.ceil(x.n/daysLeft)+' '+x.k+'</span>').join("")+'</div>'+
        (weeksLeft?'<p class="foot">Miss it and '+plural(roll,"credit")+' roll into the next '+weeksLeft+' weeks, about '+(roll/weeksLeft).toFixed(1)+' extra a week.</p>':'<p class="foot">This is your last week. Unused credits expire on '+fmtY(pd(END))+'.</p>');
    }
  } else if(!isPast){
    coach.innerHTML='<h2>Plan ahead</h2><p>'+gT+' classes planned this week. Book F2F and Group Class early; those slots fill first.</p><div class="plan">'+CK.filter(k=>g[k]).map(k=>'<span class="pill dim">'+g[k]+' '+k+'</span>').join("")+'</div>';
  } else {
    coach.innerHTML='<h2>Past week</h2><p>'+rAll+' '+(rAll===1?"class":"classes")+' logged. Use the arrows or the chart to look around.</p>';
  }

  let t='<tr><th>Program</th><th>Left</th><th>Planned</th><th>Unplanned</th><th>Per week</th></tr>', warn=false;
  const from=Math.max(curIdx,0), wl=Math.max(1,WEEKS.length-from);
  CK.forEach(k=>{
    let planned=0;
    for(let i=from;i<WEEKS.length;i++){ const gg=goals(WEEKS[i])[k]; planned+= i===curIdx? Math.max(0,gg-reality(WEEKS[i])[k]) : gg; }
    const un=cl[k]-planned; if(un) warn=true;
    t+='<tr><td>'+k+'</td><td>'+cl[k]+'</td><td>'+planned+'</td><td class="'+(un?"warn":"ok")+'">'+(un>0?"+"+un:un)+'</td><td>'+(cl[k]/wl).toFixed(1)+'</td></tr>';
  });
  $("credTable").innerHTML=t;
  $("credNote").textContent = warn
    ? "Unplanned credits aren’t in any weekly goal yet. Add them to a week in the APP_PLAN sheet so they don’t expire."
    : "Every credit left is inside a weekly goal. Stay on plan and you finish at zero.";

  let maxG=1; WEEKS.forEach(k=>{maxG=Math.max(maxG,sum(goals(k)),sum(reality(k)));});
  let ch="";
  WEEKS.forEach((k,i)=>{
    const gg=sum(goals(k)), rr=sum(reality(k));
    ch+='<button class="wk'+(i===selIdx?" sel":"")+(i===curIdx?" cur":"")+'" data-i="'+i+'" aria-label="Week '+k+': '+rr+' of '+gg+'"><div class="col"><div class="g" style="height:'+(gg/maxG*100)+'%"></div>'+(rr?'<div class="r '+(gg>0&&rr>=gg?"":"part")+'" style="height:'+(rr/maxG*100)+'%"></div>':'')+'</div><span class="lb">'+k.split(" - ")[0]+'</span></button>';
  });
  const chart=$("chart"); chart.innerHTML=ch;
  chart.querySelectorAll(".wk").forEach(b=>b.onclick=()=>{selIdx=+b.dataset.i;renderDashboard();});
  const sel=chart.querySelector(".sel"); if(sel){const w=$("chartwrap"); w.scrollLeft=sel.offsetLeft-w.clientWidth/2;}
}
$("prevW").onclick=()=>{if(selIdx>0){selIdx--;renderDashboard();}};
$("nextW").onclick=()=>{if(selIdx<WEEKS.length-1){selIdx++;renderDashboard();}};
$("toNow").onclick=()=>{if(curIdx>-1){selIdx=curIdx;renderDashboard();}};

// ---------- input: one card = one class = one note ----------
let items=[{c:null,n:""}], saving=false;
const inDate=$("inDate"); inDate.value=TODAY;
function renderItems(){
  const box=$("items"); box.innerHTML="";
  items.forEach((it,idx)=>{
    const el=document.createElement("div"); el.className="card item";
    const chips=grp=>CATS.filter(c=>c.g===grp).map(c=>'<button class="chip'+(grp==="Online"?" pk":"")+'" data-c="'+c.k+'" aria-pressed="'+(it.c===c.k)+'">'+c.k+'</button>').join("");
    el.innerHTML='<div class="itemhead"><b><span>'+(idx+1)+'</span>Class</b>'+(items.length>1?'<button class="rm">Remove</button>':'')+'</div>'+
      '<div class="pgroups"><span class="gl">Online</span><div class="chips">'+chips("Online")+'</div><span class="gl">Offline</span><div class="chips">'+chips("Offline")+'</div></div>'+
      '<p class="prog"></p>'+
      '<div class="notefield"><label for="n'+idx+'">Notes for this class</label><textarea id="n'+idx+'" maxlength="2000" placeholder="Topic, teacher, new words… e.g. IELTS Writing #3, Ms. Rina. Vocab: abide, wear off">'+esc(it.n)+'</textarea></div>';
    el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{it.c=b.dataset.c;renderItems();});
    el.querySelector("textarea").oninput=ev=>{it.n=ev.target.value;};
    const rm=el.querySelector(".rm"); if(rm) rm.onclick=()=>{items.splice(idx,1);renderItems();};
    box.appendChild(el);
  });
  updInput();
}
function updInput(){
  if(!ready()) { $("saveBtn").disabled=true; $("saveSum").textContent="Loading your plan…"; return; }
  const d=pd(inDate.value||TODAY), key=weekKey(d), {s,e}=weekRange(key), g=goals(key), r=reality(key);
  $("inWeek").textContent="Week "+key+", "+fmt(s)+"–"+fmt(e);
  const seen={};
  document.querySelectorAll(".item").forEach((el,idx)=>{
    const it=items[idx], p=el.querySelector(".prog");
    if(!it.c){p.textContent="Pick a program.";return;}
    seen[it.c]=(seen[it.c]||0)+1;
    const after=r[it.c]+seen[it.c];
    p.innerHTML=g[it.c]? "This week: "+after+" of "+g[it.c]+(after>=g[it.c]?" <b>Goal hit</b>":"") : "No goal for "+esc(it.c)+" this week.";
  });
  const inRange=inDate.value>=START && inDate.value<=END;
  const ok=items.every(i=>i.c) && inRange && !saving;
  const sb=$("saveBtn"); sb.disabled=!ok;
  if(!saving) sb.textContent=items.length>1?"Save "+items.length+" classes":"Save class";
  $("saveSum").textContent= !inRange ? "Pick a date between "+fmtY(pd(START))+" and "+fmtY(pd(END))+"." :
    (items.every(i=>i.c)? plural(items.length,"credit")+" on "+DOW[d.getDay()]+" "+fmt(d)+"." : "Pick a program for every class.");
  $("inSub").textContent=sum(creditsLeft())+" credits left. One card per class, each with its own notes.";
}
inDate.onchange=updInput;
$("addItem").onclick=()=>{items.push({c:null,n:""});renderItems();
  const all=document.querySelectorAll(".item"); all[all.length-1].scrollIntoView({behavior:"smooth",block:"center"});};
$("saveBtn").onclick=async()=>{
  const d=inDate.value||TODAY, sb=$("saveBtn");
  saving=true; sb.disabled=true; sb.textContent="Saving…"; sb.setAttribute("aria-busy","true");
  try{
    const res=await api("add",{entries:items.map(it=>({date:d,program:it.c,notes:it.n.trim()}))});
    res.saved.forEach(x=>ENTRIES.push(x));
    const key=weekKey(pd(d)), g=goals(key), r=reality(key), gT=sum(g), rT=CK.reduce((a,k)=>a+Math.min(r[k],g[k]),0);
    toast("Saved "+plural(res.saved.length,"class","classes")+". Week "+key.split(" - ")[0]+": "+rT+" of "+gT+".");
    items=[{c:null,n:""}];
  }catch(err){ if(!/^AUTH/.test(err.message)) toast("Not saved: "+err.message); }
  finally{ saving=false; sb.removeAttribute("aria-busy"); renderItems(); }
};

// ---------- log ----------
let logF="All", showAll=false;
function buildLogFilter(){
  const f=$("logFilter"); f.innerHTML="";
  ["All","Online","Offline"].forEach(x=>{const b=document.createElement("button");b.className="chip";b.textContent=x;b.setAttribute("aria-pressed",x===logF);
    b.onclick=()=>{logF=x;buildLogFilter();renderLog();};f.appendChild(b);});
}
$("logSearch").oninput=()=>renderLog();
$("allNotes").onclick=ev=>{showAll=!showAll;ev.currentTarget.setAttribute("aria-pressed",showAll);ev.currentTarget.textContent=showAll?"Hide all notes":"Show all notes";renderLog();};
const grpOf=c=>CATS.find(z=>z.k===c).g;
function renderLog(){
  if(!ready()) return;
  const q=$("logSearch").value.trim().toLowerCase();
  $("logSub").textContent=plural(ENTRIES.length,"credit")+" used since "+fmtY(pd(START))+".";
  let list=ENTRIES.filter(e=>(logF==="All"||grpOf(e.c)===logF)&&(!q||(e.n||"").toLowerCase().includes(q)||e.c.toLowerCase().includes(q)));
  list.sort((a,b)=>(b.d+(b.t||"")).localeCompare(a.d+(a.t||"")));
  const L=$("logList");
  if(!list.length){L.innerHTML='<p class="emptystate">Nothing matches. Clear the search or pick another filter.</p>';return;}
  const by={}; list.forEach(e=>{const k=weekKey(pd(e.d));(by[k]=by[k]||[]).push(e);});
  let h="";
  Object.keys(by).forEach(k=>{
    const its=by[k], {s,e}=weekRange(k);
    h+='<div class="card lweek"><h3>Week '+k+'<span>'+fmt(s)+'–'+fmt(e)+', '+plural(its.length,"credit")+'</span></h3>';
    its.forEach(x=>{
      const d=pd(x.d), open=showAll&&x.n;
      h+='<div class="entry"><div class="when">'+DOW[d.getDay()]+' '+fmt(d)+(x.t?', '+esc(x.t):'')+'</div>'+
        '<div class="tg"><span class="tag '+(grpOf(x.c)==="Online"?"on":"off")+'">'+esc(x.c)+'</span></div>'+
        '<div class="ncol">'+(x.n?'<button class="shown" aria-expanded="'+!!open+'">'+(open?"Hide notes":"Show notes")+'</button>':'<span class="nonote">No notes</span>')+'</div>'+
        '<button class="del" data-id="'+esc(x.id)+'">Delete</button>'+
        (x.n?'<div class="n"'+(open?'':' hidden')+'>'+esc(x.n)+'</div>':'')+'</div>';
    });
    h+='</div>';
  });
  L.innerHTML=h;
  L.querySelectorAll(".shown").forEach(b=>b.onclick=()=>{const n=b.closest(".entry").querySelector(".n");n.hidden=!n.hidden;b.setAttribute("aria-expanded",!n.hidden);b.textContent=n.hidden?"Show notes":"Hide notes";});
  L.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this class? Its credit goes back to your balance.")) return;
    b.disabled=true;
    try{ await api("delete",{id:b.dataset.id}); ENTRIES=ENTRIES.filter(a=>a.id!==b.dataset.id); renderLog(); toast("Class deleted."); }
    catch(err){ b.disabled=false; if(!/^AUTH/.test(err.message)) toast("Not deleted: "+err.message); }
  });
}

let tt; function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2800);}
function render(){ if(view==="dashboard") renderDashboard(); if(view==="input") updInput(); if(view==="log") renderLog(); }

// refresh when the app comes back to the foreground (e.g. reopened from the home screen)
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && idToken && savedToken()) refresh(); });

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
